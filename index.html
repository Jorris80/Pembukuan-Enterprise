<title>Pembukuan Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF;--paper:#fff;--ink:#16201B;--muted:#5B6B63;--line:#D5DDD8;--soft:#F5F8F6;
  --ledger:#1C5A45;--ledger-2:#23705A;--debit:#2A5C99;--credit:#A2402F;--warn:#B7832A;--ok:#2F7D4F;
  --r-lg:14px;--r-sm:6px;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101714;--paper:#17211C;--ink:#E4ECE7;--muted:#9BB0A5;--line:#2A3831;--soft:#1C2822;--ledger:#6BC3A0;--ledger-2:#86D3B3;--debit:#8DB5EA;--credit:#E79484}}
:root[data-theme=dark]{--bg:#101714;--paper:#17211C;--ink:#E4ECE7;--muted:#9BB0A5;--line:#2A3831;--soft:#1C2822;--ledger:#6BC3A0;--ledger-2:#86D3B3;--debit:#8DB5EA;--credit:#E79484}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ledger);outline-offset:2px}
a{color:var(--ledger)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.d{color:var(--debit)} .c{color:var(--credit)}
/* shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--ledger);color:#EAF4EF;padding:18px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;overscroll-behavior:contain}
:root[data-theme=dark] .side,:root:not([data-theme=light]) .side{background:#0C2A20}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .side{background:var(--ledger)}}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px}
.brand b{font-size:15px;letter-spacing:.2px}.brand small{display:block;opacity:.7;font-size:12px}
.mark{width:34px;height:34px;border-radius:8px;background:#EAF4EF;display:grid;place-items:center}
.nav-g{font-size:12px;opacity:.6;margin:14px 10px 4px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.08)} .nav a.on{background:rgba(255,255,255,.16);font-weight:600}
.nav .cnt{margin-left:auto;background:#F2C66D;color:#3A2A05;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 22px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btn{display:none}.side-close{display:none!important}.nav-logout{display:none!important}
.page{padding:22px;max-width:1280px;width:100%}
.offline{background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:4px}
/* elements */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--muted)} .btn.pri{background:var(--ledger);border-color:var(--ledger);color:#fff}
:root[data-theme=dark] .btn.pri{color:#0C2A20}
.btn.danger{color:var(--credit);border-color:var(--credit)} .btn.sm{padding:3px 9px;min-height:28px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:140px;flex:1}
label.f.w2{flex:2}
input,select,textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;background:var(--paper);min-height:36px;width:100%}
input:invalid:not(:placeholder-shown){border-color:var(--credit)}
textarea{min-height:90px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{padding:14px 16px;border-left:4px solid var(--ledger);background:var(--paper);border-radius:var(--r-sm);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{font-size:13px;color:var(--muted)}
.kpi.neg{border-left-color:var(--credit)}.kpi.w{border-left-color:var(--warn)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--soft);text-align:left;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0} tbody tr:hover{background:var(--soft)}
tfoot td{font-weight:700;background:var(--soft)}
.lvl1{font-weight:700}.lvl2{padding-left:22px!important}.lvl3{padding-left:40px!important}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.chip.POSTED,.chip.PAID,.chip.ACTIVE,.chip.OPEN,.chip.MATCHED,.chip.APPROVED,.chip.RECONCILED{color:var(--ok);border-color:var(--ok)}
.chip.SUBMITTED,.chip.UNDER_REVIEW,.chip.PARTIAL,.chip.SOFT_CLOSED,.chip.PENDING,.chip.WITH_DIFFERENCES{color:var(--warn);border-color:var(--warn)}
.chip.REJECTED,.chip.REVERSED,.chip.CANCELLED,.chip.CLOSED,.chip.DISPOSED,.chip.UNMATCHED{color:var(--credit);border-color:var(--credit)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 0;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--muted)}
.tabs button.on{border-color:var(--ledger);color:var(--ink);font-weight:600}
/* timbangan jurnal: elemen khas */
.scale{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0;padding:12px;border-radius:var(--r-sm);background:var(--soft)}
.pan{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.pan i{position:absolute;top:0;bottom:0;border-radius:5px;transition:width .25s}
.pan.dr i{right:0;background:var(--debit)}.pan.cr i{left:0;background:var(--credit)}
.fulcrum{text-align:center;font-size:13px;font-weight:700;min-width:120px}
.fulcrum.ok{color:var(--ok)}.fulcrum.no{color:var(--credit)}
.lines td{padding:4px}.lines input,.lines select{min-height:32px;padding:4px 6px}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.modal[hidden]{display:none}
.dlg{background:var(--paper);border-radius:var(--r-lg);width:min(820px,100%);padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-size:17px}.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(460px,92vw)}
.t{padding:10px 14px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:14px}.t.err{background:var(--credit);color:#fff}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.login .card{width:min(400px,100%);padding:26px}
.login h1{font-size:22px;margin:6px 0 2px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ledger);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chart{width:100%;height:auto;max-height:260px}
/* mobile */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  /* BUGFIX #17: dulu top+bottom+height:100vh → height menang; di Android 100vh > layar terlihat sehingga menu bawah
     tertutup bilah Home/Back dan tak bisa digulir. Kini tinggi = layar dinamis (dvh) + ruang aman di bawah. */
  .side{position:fixed;left:0;top:0;bottom:auto;height:100vh;height:100dvh;max-height:100dvh;width:min(82vw,300px);z-index:40;transform:translateX(-105%);transition:transform .2s;
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  .side .nav a{padding:11px 10px}
  .page{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
  .modal{padding:3vh 10px calc(3vh + 48px + env(safe-area-inset-bottom,0px))}
  .dlg .foot{position:sticky;bottom:0;background:var(--paper);padding-top:10px}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .top .logout-top{display:none}
  .nav .nav-logout{display:flex!important;margin-top:14px;border-top:1px solid rgba(255,255,255,.15);border-radius:0;padding-top:14px}
  .side-close{display:inline-flex!important;margin-left:auto;background:transparent;color:#EAF4EF;border-color:rgba(255,255,255,.35)}
  .top{padding:10px 14px}.page{padding:14px}
  .stack thead{display:none}
  .stack table,.stack tbody,.stack tr,.stack td{display:block;width:100%}
  .stack tr{border-bottom:1px solid var(--line);padding:6px 0}
  .stack td{border:0;padding:3px 10px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .stack td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left}
  .stack tfoot{display:block}
  .scale{grid-template-columns:1fr}
}
@media print{.side,.top,.tools,.btn,.tabs{display:none!important}.shell{display:block}.page{padding:0}.card{border:0}}
</style>
</head>

<script>
/* Penjaga awal: berdiri sendiri agar tetap jalan walau skrip utama error/terpotong. */
(function () {
  function show(title, detail) {
    if (window.__peReady) return; window.__peReady = true;
    var a = document.getElementById('app'); if (!a) return;
    a.innerHTML = '<div class="login"><div class="card"><h1 style="font-size:19px">' + title + '</h1><p class="small" style="color:#A2402F;word-break:break-word">' +
      String(detail).replace(/[<>&]/g, '') + '</p><p class="small">Buka <b>URL-aplikasi?diag=1</b> untuk memeriksa berkas yang bermasalah. ' +
      'Coba juga jendela penyamaran (incognito) atau browser lain.</p><button class="btn pri" onclick="location.reload()">Muat ulang</button></div></div>';
  }
  window.__peShow = show;
  window.onerror = function (m, src, line) { show('Skrip aplikasi error', m + (line ? ' (baris ' + line + ')' : '')); };
  setTimeout(function () {
    if (window.__peReady) return;
    if (!window.__peEnd) show('Berkas aplikasi tidak lengkap', 'Bagian akhir berkas HTML tidak ditemukan — kemungkinan terpotong saat disalin. Salin ulang berkas Js*/Index sampai baris terakhir.');
    else show('Aplikasi tidak selesai dimuat', 'Skrip berjalan tetapi tampilan belum siap setelah 20 detik. Periksa koneksi, lalu muat ulang.');
  }, 20000);
})();
</script>
<div id="net" class="offline" hidden>Offline — draf disimpan di perangkat dan dikirim otomatis saat online.</div>
<div id="app"><div class="login"><span class="spin"></span></div></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* BUGFIX #10: di iframe Apps Script, browser yang memblokir penyimpanan pihak ketiga melempar SecurityError
   saat membaca localStorage/sessionStorage → skrip mati → spinner abadi. Semua akses lewat wrapper aman. */
function safeStore(kind) {
  const mem = {};
  let s = null; try { s = window[kind]; const t = '__pe_t'; s.setItem(t, '1'); s.removeItem(t); } catch (e) { s = null; }
  return { ok: !!s,
    get(k) { try { return s ? s.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { mem[k] = String(v); try { s && s.setItem(k, String(v)); } catch (e) { } },
    del(k) { delete mem[k]; try { s && s.removeItem(k); } catch (e) { } } };
}
const LS = safeStore('localStorage'), SS = safeStore('sessionStorage');
const HAS_IDB = (function () { try { return !!window.indexedDB; } catch (e) { return false; } })();
/* ================= KONFIGURASI & TRANSPORT ================= */
const CLIENT_VERSION = '1.0.7';
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const CFG = { API_URL: window.PE_API_URL || (LS.get('pe_api') || '') };
const QUEUEABLE = { 'journal.saveDraft': 1, 'cash.save': 1, 'inv.save': 1 };
const CACHEABLE = { 'coa.list': 1, 'master.list': 1, 'company.list': 1, 'settings.get': 1 };
const S = { token: SS.get('pe_t') || LS.get('pe_t') || '', user: null, perms: [], companies: [], co: SS.get('pe_co') || LS.get('pe_co') || '', ref: {}, page: 'dash', pending: 0 };

function rawCall(action, payload) {
  const body = { action, payload, token: S.token };
  if (IS_GAS) return new Promise((res, rej) => {
    const tm = setTimeout(() => rej(Object.assign(new Error('Server tidak merespons dalam 60 detik. Coba muat ulang, atau buka di jendela penyamaran bila Anda login ke beberapa akun Google.'), { code: 'TIMEOUT' })), window.PE_TIMEOUT_MS || 60000);
    google.script.run.withSuccessHandler(r => { clearTimeout(tm); res(r); })
      .withFailureHandler(e => { clearTimeout(tm); rej(Object.assign(new Error((e && e.message) || 'Gagal terhubung ke server'), { code: 'NETWORK' })); })
      .api(action, payload, S.token);
  });
  if (!CFG.API_URL) return Promise.reject(Object.assign(new Error('URL API belum diatur'), { code: 'CONFIG' }));
  return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(e => { throw Object.assign(new Error('Gagal terhubung ke server'), { code: 'NETWORK', cause: e }); });
}
async function api(action, payload = {}, opt = {}) {
  if (QUEUEABLE[action] && !payload.idempotency_key && !payload.id) payload.idempotency_key = 'c-' + uid();
  if (!navigator.onLine && QUEUEABLE[action] && !IS_GAS && HAS_IDB) { await outbox.add(action, payload); toast('Offline: draf disimpan di antrean perangkat.'); return { queued: true }; }
  const ck = 'pe_c:' + action + ':' + JSON.stringify(payload).slice(0, 200);
  let res;
  try { res = await rawCall(action, payload); }
  catch (e) {
    if (e.code === 'NETWORK' && CACHEABLE[action]) { const c = LS.get(ck); if (c) { toast('Menampilkan data tersimpan (offline).'); return JSON.parse(c); } }
    if (e.code === 'NETWORK' && QUEUEABLE[action] && !IS_GAS && HAS_IDB) { await outbox.add(action, payload); toast('Server tak terjangkau: draf masuk antrean.'); return { queued: true }; }
    throw e;
  }
  if (!res.ok) {
    if (res.code === 'AUTH' && action !== 'auth.login') { logoutLocal(); }
    if (res.code === 'CONSENT_REQUIRED' && typeof showConsent === 'function') showConsent();
    if (res.code === 'MUST_CHANGE_PASSWORD') { S.user && (S.user.must_change = true); render(); }
    throw Object.assign(new Error(res.error), { code: res.code, extra: res.extra, cid: res.cid });
  }
  if (CACHEABLE[action]) { try { LS.set(ck, JSON.stringify(res.data)); } catch (e) { } }
  return res.data;
}
/* Antrean offline (IndexedDB) — hanya DRAF; posting selalu butuh server */
const outbox = {
  db() { return new Promise((res, rej) => { if (!HAS_IDB) return rej(new Error('IndexedDB tidak tersedia')); const r = indexedDB.open('pe', 1); r.onupgradeneeded = () => r.result.createObjectStore('outbox', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async add(action, payload) { const d = await this.db(); await new Promise((res, rej) => { const t = d.transaction('outbox', 'readwrite'); t.objectStore('outbox').put({ id: payload.idempotency_key, action, payload, ts: Date.now() }); t.oncomplete = res; t.onerror = () => rej(t.error); }); this.count(); },
  async all() { const d = await this.db(); return new Promise(res => { const r = d.transaction('outbox').objectStore('outbox').getAll(); r.onsuccess = () => res(r.result || []); }); },
  async del(id) { const d = await this.db(); return new Promise(res => { const t = d.transaction('outbox', 'readwrite'); t.objectStore('outbox').delete(id); t.oncomplete = res; }); },
  async count() { try { S.pending = (await this.all()).length; } catch (e) { S.pending = 0; } const n = document.getElementById('qcount'); if (n) n.textContent = S.pending ? S.pending + ' antrean' : ''; },
  async flush() {
    if (!navigator.onLine || !S.token || IS_GAS) return;
    let ok = 0, fail = 0;
    for (const it of await this.all()) {
      try { const r = await rawCall(it.action, it.payload); if (r.ok || r.code !== 'NETWORK') { await this.del(it.id); r.ok ? ok++ : (fail++, toast('Antrean ditolak server: ' + r.error, 1)); } } catch (e) { break; }
    }
    if (ok) toast(ok + ' draf offline berhasil dikirim.'); this.count();
  }
};
window.addEventListener('online', () => { netBanner(); outbox.flush(); });
window.addEventListener('offline', netBanner);
function netBanner() { const n = document.getElementById('net'); if (n) n.hidden = navigator.onLine; }

/* ================= DIAGNOSTIK AWAL ================= */
function showFatal(msg) {
  if (window.__peShow) return window.__peShow('Skrip aplikasi error', msg);   // satu sumber pesan (penjaga awal)
  const app = document.getElementById('app'); if (!app || document.querySelector('.shell') || document.getElementById('lf')) return;
  app.innerHTML = '<div class="login"><div class="card"><h1>Aplikasi gagal dimuat</h1><p class="small" style="color:var(--credit)">' + String(msg).replace(/[<>&]/g, '') + '</p>' +
    '<p class="small muted">Coba: (1) muat ulang halaman; (2) buka di jendela penyamaran/incognito; (3) keluar dari akun Google lain di browser ini; ' +
    '(4) izinkan cookie pihak ketiga untuk script.google.com; (5) pakai Chrome/Edge versi terbaru.</p><button class="btn pri" onclick="location.reload()">Muat ulang</button></div></div>';
}
window.addEventListener('error', e => showFatal((e.error && e.error.message) || e.message || 'Kesalahan skrip'));
window.addEventListener('unhandledrejection', e => showFatal((e.reason && e.reason.message) || 'Kesalahan tak tertangani'));

/* ================= UTILITAS ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const NF = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const NF2 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function rp(n) { n = Number(n || 0); const s = NF2.format(Math.abs(n)); return (n < 0 ? '(' : '') + 'Rp ' + s + (n < 0 ? ')' : ''); }
function num(n) { return n ? NF2.format(n) : '–'; }

/* ================= TABEL (search, sort, paging, kartu di mobile) ================= */
const TBL = {};
function table(id, cols, rows, opt = {}) {
  TBL[id] = TBL[id] || { page: 1, sort: null, dir: 1, q: '' };
  const st = TBL[id]; st.cols = cols; st.rows = rows || []; st.opt = opt;
  return `<div id="t_${id}">${tableInner(id)}</div>`;
}
function tableInner(id) {
  const st = TBL[id], { cols, opt } = st, size = opt.size || 25;
  let rows = st.rows;
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => cols.some(c => String(r[c.k] ?? '').toLowerCase().includes(q))); }
  if (st.sort) rows = rows.slice().sort((a, b) => { const x = a[st.sort], y = b[st.sort]; return (typeof x === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'id')) * st.dir; });
  const pages = Math.max(1, Math.ceil(rows.length / size)); st.page = Math.min(st.page, pages);
  const view = opt.nopage ? rows : rows.slice((st.page - 1) * size, st.page * size);
  const search = opt.search === false ? '' : `<div class="tools"><label class="f" style="max-width:320px">Cari<input type="search" value="${esc(st.q)}" data-tq="${id}" placeholder="Ketik untuk menyaring"></label>${opt.toolsHtml || ''}</div>`;
  if (!st.rows.length) return search + `<div class="tbl-wrap"><div class="empty">${esc(opt.empty || 'Belum ada data.')}</div></div>`;
  const th = cols.map(c => `<th data-ts="${id}:${c.k}" class="${c.n ? 'num' : ''}">${esc(c.l)}${st.sort === c.k ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + (opt.actions ? '<th></th>' : '');
  const tb = view.map(r => `<tr ${opt.rowAct ? `data-act="${opt.rowAct}" data-id="${esc(r.id || '')}" style="cursor:pointer"` : ''}>` + cols.map(c => {
    const v = c.f ? c.f(r[c.k], r) : c.n ? num(r[c.k]) : esc(r[c.k]); return `<td data-l="${esc(c.l)}" class="${c.n ? 'num' : ''} ${c.cls ? c.cls(r) : ''}">${v}</td>`;
  }).join('') + (opt.actions ? `<td data-l="">${opt.actions(r)}</td>` : '') + '</tr>').join('');
  const foot = opt.foot ? `<tfoot><tr>${opt.foot}</tr></tfoot>` : '';
  const pager = !opt.nopage && pages > 1 ? `<div class="pager">${rows.length} baris · hal ${st.page}/${pages} <button class="btn sm" data-tp="${id}:-1" ${st.page < 2 ? 'disabled' : ''}>‹</button><button class="btn sm" data-tp="${id}:1" ${st.page >= pages ? 'disabled' : ''}>›</button></div>` : '';
  return search + `<div class="tbl-wrap stack"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${foot}</table></div>` + pager;
}
function retable(id) { const el = document.getElementById('t_' + id); if (el) { const f = document.activeElement && document.activeElement.dataset.tq; el.innerHTML = tableInner(id); if (f) { const i = el.querySelector('[data-tq]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } }
document.addEventListener('input', e => { const t = e.target.dataset.tq; if (t) { TBL[t].q = e.target.value; TBL[t].page = 1; retable(t); } });
document.addEventListener('click', e => {
  const s = e.target.closest('[data-ts]'); if (s) { const [id, k] = s.dataset.ts.split(':'); const st = TBL[id]; st.dir = st.sort === k ? -st.dir : 1; st.sort = k; retable(id); return; }
  const p = e.target.closest('[data-tp]'); if (p) { const [id, d] = p.dataset.tp.split(':'); TBL[id].page += +d; retable(id); return; }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) { e.preventDefault(); Promise.resolve(ACT[a.dataset.act](a.dataset, a, e)).catch(fail); }
});

/* ================= FORM & MODAL ================= */
function field(f, v) {
  const val = v ?? f.def ?? '', req = f.req ? 'required' : '', id = 'f_' + f.k;
  let inp;
  if (f.t === 'select') inp = `<select id="${id}" name="${f.k}" ${req}>${f.blank !== false ? '<option value="">— pilih —</option>' : ''}${(f.o || []).map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(val) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if (f.t === 'area') inp = `<textarea id="${id}" name="${f.k}" ${req} maxlength="${f.max || 500}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  else if (f.t === 'check') return `<label class="f" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="${f.k}" style="width:auto;min-height:0" ${val === true || val === 'TRUE' ? 'checked' : ''}> ${esc(f.l)}</label>`;
  else inp = `<input id="${id}" name="${f.k}" type="${f.t || 'text'}" value="${esc(val)}" ${req} ${f.t === 'number' ? 'step="0.01" min="0" inputmode="decimal"' : ''} maxlength="${f.max || 200}" placeholder="${esc(f.ph || ' ')}" ${f.ro ? 'readonly' : ''}>`;
  return `<label class="f ${f.w2 ? 'w2' : ''}">${esc(f.l)}${f.req ? ' *' : ''}${inp}${f.help ? `<span class="small">${esc(f.help)}</span>` : ''}</label>`;
}
function readForm(el) {
  const o = {}; $$('input,select,textarea', el).forEach(i => { if (!i.name) return; o[i.name] = i.type === 'checkbox' ? i.checked : i.type === 'number' ? (i.value === '' ? '' : Number(i.value)) : i.value.trim(); }); return o;
}
function modal(title, body, opt = {}) {
  const m = $('#modal');
  m.dataset.locked = opt.locked ? '1' : '';
  m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><form id="mform" novalidate>${body}<div class="foot">${opt.locked ? '' : `<button type="button" class="btn" data-act="closeModal">${esc(opt.cancel || 'Tutup')}</button>`}${opt.ok ? `<button class="btn pri" type="submit">${esc(opt.ok)}</button>` : ''}</div></form></div>`;
  m.hidden = false;
  const f = $('#mform'); const first = f.querySelector('input,select,textarea'); if (first) first.focus();
  f.onsubmit = async ev => { ev.preventDefault(); if (!opt.onOk) return; if (!f.checkValidity()) { f.reportValidity(); return; }
    const b = f.querySelector('[type=submit]'); busy(b, true); try { const r = await opt.onOk(readForm(f), f); if (r !== false) closeModal(); } catch (e) { fail(e); } finally { busy(b, false); } };
  return f;
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; $('#modal').dataset.locked = ''; }
function confirmBox(msg, reasonLabel) {
  return new Promise(res => modal('Konfirmasi', `<p>${esc(msg)}</p>${reasonLabel ? field({ k: 'reason', l: reasonLabel, t: 'area', req: true }) : ''}`, { ok: 'Lanjutkan', cancel: 'Batal', onOk: d => res(d) }));
}
function formModal(title, fields, vals, onOk) { return modal(title, `<div class="row">${fields.map(f => field(f, vals ? vals[f.k] : undefined)).join('')}</div>`, { ok: 'Simpan', cancel: 'Batal', onOk }); }

function trendChart(rows) {
  if (!rows || !rows.length) return '';
  const W = 720, H = 220, pad = 30, max = Math.max(1, ...rows.map(r => Math.max(r.revenue, r.expense))), bw = (W - pad * 2) / rows.length;
  const bars = rows.map((r, i) => { const x = pad + i * bw, hr = (r.revenue / max) * (H - 50), he = (r.expense / max) * (H - 50);
    return `<rect x="${x + bw * .12}" y="${H - 24 - hr}" width="${bw * .36}" height="${Math.max(0, hr)}" fill="var(--debit)" rx="2"><title>${MON[+r.period.slice(5) - 1]}: pendapatan ${rp(r.revenue)}</title></rect><rect x="${x + bw * .52}" y="${H - 24 - he}" width="${bw * .36}" height="${Math.max(0, he)}" fill="var(--credit)" rx="2"><title>beban ${rp(r.expense)}</title></rect><text x="${x + bw / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--muted)">${MON[+r.period.slice(5) - 1]}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pendapatan dan beban"><line x1="${pad}" x2="${W - pad}" y1="${H - 24}" y2="${H - 24}" stroke="var(--line)"/><text x="${pad}" y="14" font-size="11" fill="var(--muted)">maks ${short(max)}</text>${bars}</svg>`;
}

function docActions(docType, r, extra = '') {
  const b = [];
  if (['DRAFT', 'REJECTED'].includes(r.status) && r.created_by === S.user.id) b.push(`<button class="btn sm" data-act="submitDoc" data-t="${docType}" data-id="${r.id}">Ajukan</button>`, `<button class="btn sm" data-act="cancelDoc" data-t="${docType}" data-id="${r.id}">Batalkan</button>`);
  if (r.status === 'APPROVED' && can('journal.post')) b.push(`<button class="btn sm pri" data-act="postDoc" data-t="${docType}" data-id="${r.id}">Posting</button>`);
  if (r.status !== 'DRAFT') b.push(`<button class="btn sm" data-act="history" data-t="${docType}" data-id="${r.id}">Riwayat</button>`);
  if (r.journal_id) b.push(`<button class="btn sm" data-act="openJournal" data-id="${r.journal_id}">Jurnal</button>`);
  return `<div class="row" style="gap:4px;justify-content:flex-end">${b.join('')}${extra}</div>`;
}

   <button type="button" class="btn sm" data-act="addLine" style="margin-top:8px">+ Baris</button>

  } });
  ACT.addLine = () => { $('#jl').insertAdjacentHTML('beforeend', lineRow()); balance(); };
  ACT.delLine = (_, b) => { if ($$('#jl tr').length > 2) b.closest('tr').remove(); balance(); };
  $('#jl').addEventListener('input', e => { if (e.target.name === 'dr' && e.target.value) $('[name=cr]', e.target.closest('tr')).value = ''; if (e.target.name === 'cr' && e.target.value) $('[name=dr]', e.target.closest('tr')).value = ''; balance(); });
  balance();

function balance() {

}

      inv, { actions: r => docActions(L.doc, r) });
    else h += `<div class="tools"><button class="btn pri" data-act="payNew">${L.pay} baru</button></div>` + table('pay' + kind, [{ k: 'date', l: 'Tanggal', f: dt }, { k: 'number', l: 'Nomor', f: v => esc(v || '(draf)') }, { k: 'party_name', l: L.party }, { k: 'bank_code', l: 'Kas/bank' }, { k: 'amount', l: 'Nominal', n: 1 }, { k: 'status', l: 'Status', f: chip }], pays, { actions: r => docActions(L.pdoc, r) });
    P(h);

      const f = [{ k: 'party_id', l: L.party, t: 'select', req: 1, o: kind === 'AP' ? OPT.supp() : OPT.cust() }, { k: 'date', l: 'Tanggal', t: 'date', req: 1, def: today() }, { k: 'due_date', l: 'Jatuh tempo', t: 'date', help: 'Kosong = sesuai termin mitra' }];

      f.push({ k: 'account_code', l: kind === 'AP' ? 'Akun beban/aset' : 'Akun pendapatan', t: 'select', req: 1, o: OPT.acc(a => kind === 'AP' ? ['EXPENSE', 'COGS', 'ASSET', 'OTHER_EXPENSE'].includes(a.type) : ['REVENUE', 'OTHER_INCOME'].includes(a.type)) },
        { k: 'subtotal', l: 'DPP / subtotal (Rp)', t: 'number', req: 1 }, { k: 'tax_code', l: 'PPN', t: 'select', o: OPT.tax(kind === 'AP' ? 'VAT_IN' : 'VAT_OUT') });
      if (kind === 'AP') f.push({ k: 'wht_code', l: 'PPh dipotong', t: 'select', o: OPT.tax('WHT') });
      f.push({ k: 'dept_id', l: 'Departemen', t: 'select', o: OPT.dept() }, { k: 'project_id', l: 'Proyek', t: 'select', o: OPT.proj() }, { k: 'description', l: 'Keterangan', w2: 1, max: 300 });
      formModal(L.inv + ' baru', f, {}, async v => { const r = await api('inv.save', Object.assign({ kind, company_id: S.co }, v)); if (r.queued) return; (r.warnings || []).forEach(w => toast(w, 1)); toast('Draf invoice tersimpan (total ' + rp(r.invoice.total) + ').'); render(); });
    };

        $('#alloc').oninput = () => { $('#alsum').textContent = rp($$('#alloc input').reduce((s, i) => s + Number(i.value || 0), 0)); };
      };
    };
  };
}

    { rowAct: 'userEdit', actions: r => `<button class="btn sm" data-act="userReset" data-id="${r.id}">Reset password</button>` }));
  ACT.userEdit = d => { const u = rows.find(x => x.id === d.id) || { active: true };
    formModal(d.id ? 'Ubah pengguna' : 'Tambah pengguna', [{ k: 'name', l: 'Nama', req: 1 }, { k: 'email', l: 'Email', t: 'email', req: 1 }, { k: 'role', l: 'Peran', t: 'select', req: 1, o: ROLES }, { k: 'company_id', l: 'Batasi ke perusahaan', t: 'select', o: S.companies.map(c => [c.id, c.name]) }, { k: 'branch_id', l: 'Cabang', t: 'select', o: OPT.branch() }].concat(d.id ? [{ k: 'active', l: 'Aktif', t: 'check' }, { k: 'unlock', l: 'Buka kunci login', t: 'check' }] : []), u,
      async v => { const r = await api('user.save', { id: d.id, data: v }); if (r.temp_password) modal('Pengguna dibuat', `<p>Berikan password sementara ini secara pribadi. Pengguna wajib menggantinya saat login pertama.</p><p style="font-size:20px"><b>${esc(r.temp_password)}</b></p><p class="small muted">Password ini tidak akan ditampilkan lagi.</p>`); else toast('Tersimpan.'); PAGES.users(); return !r.temp_password; }); };
  ACT.userReset = async d => { const c = await confirmBox('Reset password pengguna ini? Password lama langsung tidak berlaku.', 'Alasan'); const r = await api('user.resetPassword', { id: d.id, reason: c.reason }); modal('Password sementara', `<p style="font-size:20px"><b>${esc(r.temp_password)}</b></p><p class="small muted">Sampaikan secara pribadi. Tidak ditampilkan lagi.</p>`); };
};

/* ================= PENGATURAN & AKUN ================= */
PAGES.settings = async () => {
  let h = `<div class="card"><h2>Akun saya</h2><p>${esc(S.user.name)} · ${esc(S.user.email)} · ${esc(S.user.role_label)}</p><div style="max-width:420px">${renderChangePw(false)}</div></div>
   <div class="card"><h2>Autentikasi dua langkah (MFA)</h2><p class="muted small">${S.user.mfa ? 'MFA aktif pada akun Anda.' : 'Gunakan Google Authenticator / Microsoft Authenticator. Wajib untuk akun penting.'}</p>${S.user.mfa ? '' : '<button class="btn" data-act="mfaStart">Aktifkan MFA</button>'}</div>
   <div class="card"><h2>Perangkat yang masuk</h2><div id="sessl" class="small muted"><span class="spin"></span></div>
     <p style="margin-top:10px"><button class="btn danger" data-act="logoutAll">Keluarkan semua perangkat lain</button></p></div>
   <div class="card"><h2>Tampilan</h2><div class="row"><button class="btn" data-act="theme" data-v="light">Terang</button><button class="btn" data-act="theme" data-v="dark">Gelap</button><button class="btn" data-act="theme" data-v="">Ikuti sistem</button></div></div>`;
  if (!IS_GAS) h += `<div class="card"><h2>Mode offline</h2><p class="small muted">Draf jurnal, kas, dan invoice yang dibuat saat offline disimpan di perangkat ini lalu dikirim otomatis. Posting & persetujuan selalu memerlukan koneksi.</p><p>Antrean: <b>${S.pending}</b></p><button class="btn" data-act="flush">Kirim sekarang</button> <button class="btn" data-act="resetApi">Ganti server</button></div>`;
  if (can('user.admin')) { const s = await api('settings.get'); h += `<div class="card"><h2>Pengaturan sistem</h2><form id="stf"><div class="row">${Object.keys(s).map(k => field({ k, l: k, w2: k.startsWith('TAX') || /_FOLDER_ID$/.test(k), ph: /_FOLDER_ID$/.test(k) ? 'Tempel URL folder Google Drive' : '', help: /_FOLDER_ID$/.test(k) ? 'Boleh URL lengkap folder; sistem mengambil ID-nya dan memeriksa akses.' : '' }, s[k])).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri">Simpan pengaturan</button><button type="button" class="btn" data-act="backup">Cadangkan sekarang</button></div></form></div>`; }
  P(h); bindPw();
  api('auth.sessions').then(list => { $('#sessl').innerHTML = list.map(x => `<p style="margin:4px 0">${x.current ? '<b>Perangkat ini</b> · ' : ''}${esc(x.device || 'Perangkat')} — aktif ${esc((x.last_seen || '').replace('T', ' ').slice(0, 16))}${x.remember ? ' · diingat s/d ' + dt(x.expires_at) : ''}</p>`).join('') || 'Tidak ada.'; }).catch(e => { $('#sessl').textContent = e.message; });
  if ($('#stf')) $('#stf').onsubmit = async e => { e.preventDefault(); try { await api('settings.save', { data: readForm(e.target) }); toast('Pengaturan disimpan.'); } catch (err) { fail(err); } };
};
ACT.theme = d => { d.v ? document.documentElement.setAttribute('data-theme', d.v) : document.documentElement.removeAttribute('data-theme'); LS.set('pe_theme', d.v); };
ACT.flush = () => outbox.flush();
ACT.logoutAll = async () => { await confirmBox('Keluarkan akun Anda dari semua perangkat lain? Perangkat ini tetap masuk.'); const r = await api('auth.logoutAll', { keep_current: true }); toast(r.revoked + ' sesi di perangkat lain diakhiri.'); render(); };
ACT.backup = async () => { const r = await api('sys.backup'); toast('Cadangan dibuat: ' + r.name); };
ACT.mfaStart = async () => { const r = await api('mfa.enroll');
  modal('Aktifkan MFA', `<p>Di aplikasi authenticator pilih “Masukkan kunci penyiapan”, lalu ketik kunci berikut (berbasis waktu):</p><p style="font-size:18px;word-break:break-all"><b>${esc(r.secret.replace(/(.{4})/g, '$1 '))}</b></p><p class="small muted">Atau tautan: ${esc(r.uri)}</p>${field({ k: 'otp', l: 'Kode 6 digit dari aplikasi', req: 1, max: 6 })}`,
    { ok: 'Verifikasi & aktifkan', cancel: 'Batal', onOk: async v => { await api('mfa.confirm', { otp: v.otp }); S.user.mfa = true; toast('MFA aktif. Login berikutnya meminta kode.'); render(); } }); };

/* ================= TENTANG, LISENSI, S&K, PRIVASI ================= */
async function legalHtml(doc) {
  const d = await api('legal.get', { doc });
  return `<p class="small muted">Versi dokumen ${esc(d.version)} · berlaku untuk ${esc(d.org)} · aplikasi v${esc(d.app_version)}</p>` +
    d.sections.map(s => `<h3 style="font-size:14px;margin:14px 0 4px">${esc(s.h)}</h3><p style="margin:0">${esc(s.p)}</p>`).join('');
}
ACT.legal = async d => { const doc = d.d === 'privacy' ? 'privacy' : 'terms';
  const back = !$('#modal').hidden && $('#modal').dataset.locked;
  modal(doc === 'privacy' ? 'Pemberitahuan Privasi' : 'Syarat & Ketentuan Penggunaan', '<div id="lgl" style="max-height:60vh;overflow:auto"><span class="spin"></span></div>' + (back ? '<p><button type="button" class="btn" data-act="consentBack">← Kembali ke persetujuan</button></p>' : ''), { locked: !!back });
  try { $('#lgl').innerHTML = await legalHtml(doc); } catch (e) { $('#lgl').textContent = e.message; } };
let consentWait = null;
function showConsent() {
  if (consentWait) { renderConsent(); return consentWait.p; }
  let res; const p = new Promise(r => res = r); consentWait = { p, res }; renderConsent(); return p;
}
function renderConsent() {
  modal('Persetujuan penggunaan', `<p>Sebelum melanjutkan, baca dan setujui dokumen berikut. Dokumen dapat dibuka kembali kapan saja dari menu <b>Tentang &amp; Lisensi</b>.</p>
    <p><a href="#" data-act="legal" data-d="terms">Syarat &amp; Ketentuan Penggunaan</a><br><a href="#" data-act="legal" data-d="privacy">Pemberitahuan Privasi</a></p>
    <label class="f" style="flex-direction:row;align-items:flex-start;gap:8px"><input type="checkbox" name="agree" id="consentf" style="width:auto;min-height:0;margin-top:3px"> Saya telah membaca dan menyetujui Syarat &amp; Ketentuan serta Pemberitahuan Privasi.</label>
    <p class="small muted">Persetujuan dicatat di jejak audit beserta waktu dan versi dokumen.</p>`,
    { ok: 'Setuju & lanjutkan', locked: true, onOk: async v => { if (!v.agree) { toast('Centang persetujuan terlebih dahulu.', 1); return false; }
      await api('consent.accept', { accept: true, ua: navigator.userAgent.slice(0, 200) }); S.consent = true;
      const w = consentWait; consentWait = null; if (w) w.res(true); toast('Terima kasih. Persetujuan tersimpan.'); } });
}
ACT.consentBack = () => renderConsent();

const TIER_INFO = { TRIAL: 'Uji coba 30 hari · 1 perusahaan · 2 cabang · 5 pengguna', STARTER: '1 perusahaan · 2 cabang · 5 pengguna',
  BUSINESS: '3 perusahaan · cabang tak terbatas · 20 pengguna', ENTERPRISE: 'Perusahaan & pengguna tak terbatas · laporan konsolidasi' };
PAGES.about = async () => {
  const L = await api('license.info'); S.lic = Object.assign(S.lic || {}, L);
  const lim = (k, l) => { const max = L.limits[k], use = L.usage[k], pct = max ? Math.min(100, Math.round(use / max * 100)) : 0;
    return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between" class="small"><span>${l}</span><b>${use} / ${max || '∞'}</b></div><div class="pan"><i style="left:0;width:${max ? pct : 4}%;background:${pct >= 100 ? 'var(--credit)' : 'var(--ledger)'}"></i></div></div>`; };
  const mismatch = L.app.version !== CLIENT_VERSION;
  P(`<div class="grid">
   <div class="card"><h2>Aplikasi</h2>
     <p><b>${esc(L.app.name)}</b></p>
     <p class="small">Versi server: <b>${esc(L.app.version)}</b><br>Versi tampilan: <b>${esc(CLIENT_VERSION)}</b>${mismatch ? '<br><span class="c">Versi berbeda — perbarui berkas Client*.gs / Config.gs, lalu buat versi deployment baru.</span>' : ''}<br>
     Dipasang: ${dt(L.app.installed_at)}<br>Syarat &amp; Ketentuan v${esc(L.app.terms_version)} · Privasi v${esc(L.app.privacy_version)}</p>
     <p><a href="#" data-act="legal" data-d="terms">Syarat &amp; Ketentuan</a> · <a href="#" data-act="legal" data-d="privacy">Pemberitahuan Privasi</a></p></div>
   <div class="card"><h2>Lisensi</h2>
     <p><span class="chip ${L.valid ? 'ACTIVE' : L.readonly ? 'CANCELLED' : 'PENDING'}">${esc(L.label)}</span> ${L.readonly ? '<b class="c">Mode baca-saja</b>' : ''}</p>
     <p class="small">${esc(TIER_INFO[L.tier] || '')}</p>
     ${L.valid ? `<p class="small">No. lisensi: <b>${esc(L.license_no)}</b><br>Pemegang: ${esc(L.customer)}<br>Penyedia: ${esc(L.provider || '-')}<br>Diterbitkan: ${dt(L.issued)}<br>Dukungan s/d: ${L.support_until ? dt(L.support_until) + (L.support_active ? '' : ' <span class="c">(berakhir — aplikasi tetap berjalan)</span>') : 'tanpa batas'}${L.expires ? '<br>Lisensi berakhir: ' + dt(L.expires) : ''}</p>`
       : `<p class="small">${L.readonly ? 'Uji coba berakhir ' + dt(L.trial_end) + '.' : 'Uji coba berakhir ' + dt(L.trial_end) + ' (' + L.trial_days_left + ' hari lagi).'}${L.error ? '<br><span class="c">' + esc(L.error) + '</span>' : ''}</p>`}
     ${lim('companies', 'Perusahaan aktif')}${lim('branches', 'Cabang aktif')}${lim('users', 'Pengguna aktif')}</div>
   </div>
   <div class="card"><h2>ID instalasi</h2><p class="small muted">Kirim ID ini ke penyedia saat membeli atau meng-upgrade lisensi. Kunci lisensi hanya berlaku untuk instalasi ini.</p>
     <p style="font-size:20px;letter-spacing:1px"><b id="iid">${esc(L.install_id)}</b> <button class="btn sm" data-act="copyIid">Salin</button></p></div>
   ${can('user.admin') ? `<div class="card"><h2>Aktifkan / upgrade lisensi</h2><form id="licf">${field({ k: 'key', l: 'Kunci lisensi dari penyedia', t: 'area', req: true, max: 4000 })}<div class="row" style="margin-top:10px"><button class="btn pri">Aktifkan</button></div></form></div>` : ''}`);
  if ($('#licf')) $('#licf').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('button'); busy(b, true);
    try { const r = await api('license.activate', readForm(e.target)); S.lic = r; toast('Lisensi ' + r.label + ' aktif (' + r.license_no + ').'); render(); } catch (err) { fail(err); busy(b, false); } };
};
ACT.copyIid = () => { const t = $('#iid').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('ID instalasi disalin.'), () => toast('Salin manual: ' + t)); };

(function () { const t = LS.get('pe_theme'); if (t) document.documentElement.setAttribute('data-theme', t); })();
boot();

window.__peEnd = '1.0.4';
</script>
